name: Frontend CI

# Build y type-check del frontend. Corre en los runners de GitHub con
# acceso normal a npm.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Upload build (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 15
