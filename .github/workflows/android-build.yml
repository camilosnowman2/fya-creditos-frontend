name: Android APK/AAB Build

# Genera el .apk (debug) y el .aab (release sin firmar) pedidos por el
# examen. Corre en los runners de GitHub con acceso a Android SDK/Gradle.
#
# El .aab de release sale SIN FIRMAR (Gradle genera igual el artifact,
# pero para publicarlo en Play Store hay que firmarlo con tu propio
# keystore). Para pruebas/entrega del examen, el .apk de debug ya es
# instalable directamente en un dispositivo o emulador.

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup JDK 17 (requerido por Capacitor/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Add Android platform (si no está commiteada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB (sin firmar)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fya-creditos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fya-creditos-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
